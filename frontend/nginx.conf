server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing, so any unknown path
    # should fall back to index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html stays uncached
    # so deploys are picked up immediately.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
